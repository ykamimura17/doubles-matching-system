<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
🎾 League of Enecom（エネコム社内大会）🏆
</title>

<style>

:root{

    --primary:#5BA8FF;
    --primary-hover:#2E86F7;

    --bg:#F5F7FB;
    --card:#FFFFFF;

}

/***********************************
 共通
***********************************/

body{

    background:var(--bg);

    margin:20px;

    font-family:
        "Segoe UI",
        sans-serif;

}

h1{

    color:#1565C0;

}

.hidden{

    display:none;

}

.card{

    background:white;

    border-radius:16px;

    padding:16px;

    margin-bottom:16px;

    box-shadow:
      0 4px 12px
      rgba(0,0,0,.08);

}

/***********************************
 ボタン
***********************************/

button{

    background:var(--primary);

    color:white;

    border:none;

    border-radius:10px;

    padding:10px 16px;

    cursor:pointer;

    font-size:14px;

    font-weight:600;

    transition:.2s;

    margin:4px;

}

button:hover{

    background:
        var(--primary-hover);

    transform:
        translateY(-1px);

}

/***********************************
 入力
***********************************/

input,
select{

    padding:8px;

    border:
      1px solid #ddd;

    border-radius:8px;

    margin:4px;

}

/***********************************
 テーブル
***********************************/

table{

    width:100%;

    border-collapse:
        collapse;

}

th,
td{

    border:
        1px solid #ddd;

    padding:8px;

}

th{

    background:#1976D2;

    color:white;

}

/***********************************
 列幅
***********************************/

.col-name{

    width:150px;

}

.col-status{

    width:200px;

}

.col-point{

    width:80px;

    text-align:center;

}

.col-match{

    width:80px;

    text-align:center;

}

.col-small{

    width:80px;

    text-align:center;

}

.col-comment{

    width:450px;

}

/***********************************
 状態
***********************************/

.status-badge{

    display:inline-block;

    padding:4px 8px;

    border-radius:8px;

    font-weight:bold;

}

.status-waiting{

    background:#E3F2FD;

    color:#1565C0;

}

.status-playing{

    background:#FFEBEE;

    color:#C62828;

}

.status-rest{

    background:#EEEEEE;

    color:#616161;

}

/***********************************
 コート
***********************************/

.court-card{

    background:white;

    border-left:
        8px solid #4CAF50;

    border-radius:12px;

    padding:12px;

    margin-bottom:10px;

}

.court-playing{

    border-left-color:#D32F2F;

}

.court-empty{

    border-left-color:#4CAF50;

}

/***********************************
 ランキング
***********************************/

.rank-card{

    background:#FFF8E1;

    border-left:
      6px solid gold;

    padding:10px;

    margin-bottom:6px;

}

/***********************************
 MVP
***********************************/

.award-card{

    background:#FFFDE7;

    border-left:
      6px solid gold;

    padding:12px;

    margin-bottom:10px;

}

/***********************************
 その他
***********************************/

.comment-input{

    width:350px;

}

.admin{

    color:#C62828;
    font-weight:bold;

}

.viewer{

    color:#1565C0;
    font-weight:bold;

}

.pager{

    text-align:center;

    margin-top:10px;

}


/* COURTSIDE responsive refresh */
:root{--primary:#123D32;--primary-hover:#205747;--bg:#F5F7F2;--card:#FFFFFF;--lime:#C5F26D;--muted:#698078;--ink:#182A25}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:1480px;margin:0 auto;padding:26px 24px 100px}
body>h1{color:var(--primary);font-size:clamp(22px,2.6vw,34px);letter-spacing:-.03em;margin:10px 0 24px}
h1,h2,h3{color:var(--primary)}
h2{font-size:clamp(19px,2vw,27px);margin:0 0 19px}
.card{border:1px solid #E7EDE5;border-radius:20px;box-shadow:0 9px 28px #123D320b;padding:24px;margin-bottom:20px;scroll-margin-top:95px}
button{background:var(--primary);color:var(--lime);border-radius:12px;padding:12px 18px}
button:hover{background:var(--primary-hover)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{border:1px solid #D8E4D5;background:#fff;color:var(--ink);min-height:43px;max-width:100%}
th{background:var(--primary);color:white}
th,td{border-color:#E4ECE3;padding:11px 9px}
td{overflow-wrap:anywhere}
.status-waiting{background:#E7F3DC;color:#123D32}
.status-playing{background:#DFF6B3;color:#123D32}
.status-rest{background:#EAEEEB;color:#698078}
.rank-card{background:white;border:1px solid #E7EDE5;border-left:5px solid var(--lime);padding:17px;border-radius:13px;margin-bottom:9px;display:flex;align-items:center;gap:14px}
.rank-card .rank-name{font-size:20px;font-weight:750;flex:1}
.rank-card .rank-meta{display:flex;flex-direction:column;align-items:end;gap:4px}
.rank-card small,.player-record{font-size:11px;color:var(--muted)}
#rankingArea:not(.hidden){display:block}
#courtArea{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.court-card{border:0;padding:0;margin:0;overflow:hidden;background:#fff;border-radius:19px;box-shadow:0 10px 24px #123D3214}
.court-card .court-head{background:#123D32;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:17px 18px;font-size:17px;font-weight:800}
.court-head .court-status{background:#C5F26D;color:#123D32;border-radius:30px;font-size:12px;font-weight:800;padding:7px 12px}
.court-head .court-status.empty{background:#EDF2EA}
.court-surface{height:220px;position:relative;overflow:hidden;background:linear-gradient(150deg,#22492D,#628A46 44%,#375C36);isolation:isolate}
.court-surface::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 14% 18%,#dae3b82b,transparent 45%),radial-gradient(ellipse at 90% 82%,#142b1e44,transparent 50%);pointer-events:none}
.court-lines{position:absolute;inset:7% 12%;border:2px solid #F8F8E8;pointer-events:none}
.court-lines::before{content:"";position:absolute;inset:0 8%;border-left:2px solid #F8F8E8;border-right:2px solid #F8F8E8}
.service-lines{position:absolute;left:20%;right:20%;top:31%;bottom:31%;border-top:2px solid #F8F8E8;border-bottom:2px solid #F8F8E8}
.service-lines::after{content:"";position:absolute;left:50%;top:0;height:100%;border-left:2px solid #F8F8E8}
.net-line{position:absolute;left:8%;right:8%;top:50%;height:12px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#eff1e7aa 0 1px,transparent 1px 5px),repeating-linear-gradient(0deg,#eff1e7aa 0 1px,#27463088 1px 5px);border-top:3px solid #fff;box-shadow:0 8px 7px #0005}
.team-overlay{position:absolute;left:50%;transform:translateX(-50%);z-index:3;text-align:center;color:#fff;background:#0D3027e8;padding:9px 15px;border:1px solid #ffffff33;border-radius:13px;white-space:nowrap;font-size:clamp(13px,1.35vw,18px);font-weight:800;text-shadow:0 1px 3px #0D302777;max-width:95%}
.team-overlay.top{top:14%}.team-overlay.bottom{bottom:11%}
.team-overlay.versus{top:50%;transform:translate(-50%,-50%);font-size:14px;padding:5px 13px;border-radius:50px}
.court-bottom{background:#FAFBF7;padding:14px;text-align:center;color:var(--muted);font-size:12px}
.court-action{display:block;width:100%;min-height:48px;margin:0;border-radius:0;background:#FAFBF7;color:#123D32;font-weight:700;font-size:13px}
.court-action:hover{background:#E7F3DC;color:#123D32}
.court-action.viewer{background:#FAFBF7;color:#698078;cursor:default}
.court-empty{cursor:default}
.court-menu{margin:12px 0 0;padding:18px;border:1px solid #DCE8DA;border-radius:18px;background:#F5F7F2}
.court-menu h3{margin:0 0 12px}
.court-menu button{min-height:48px}
.court-menu .menu-actions{display:flex;gap:8px;flex-wrap:wrap}
.court-menu .menu-actions button{flex:1;min-width:160px}
.court-menu .menu-actions .secondary{background:#E7F3DC;color:#123D32}
.court-menu label{display:block;margin:12px 0;font-weight:700;font-size:13px}
.court-menu select{display:block;width:100%;margin:5px 0 0}
.court-menu .teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.court-menu .teams h4{margin:9px 0}
.court-menu .status-error{color:#A33325}
.courts-summary{display:flex;gap:10px;margin-bottom:18px}
.courts-summary .metric{background:white;border:1px solid #E7EDE5;border-radius:15px;padding:16px;min-width:110px;flex:1}
.metric strong{display:block;color:#123D32;font-size:25px;margin-top:5px}
#courtArea + #courtInteraction{margin-top:16px}
#rankingArea .rank-card .rank-points{font-size:17px;font-weight:800;color:#123D32}
#playerTable td .player-record{display:block;margin-top:4px}
#appNav{display:flex;position:sticky;top:0;z-index:15;background:#123D32;border-radius:15px;padding:8px;gap:8px;margin-bottom:20px;box-shadow:0 10px 25px #123D3220}
#appNav a{flex:1;text-decoration:none;color:#e5f4df;text-align:center;padding:11px 7px;border-radius:10px;font-size:13px;font-weight:700}
#appNav a:hover,#appNav a:focus{background:#C5F26D;color:#123D32}
@media(max-width:1000px){#courtArea{grid-template-columns:repeat(2,minmax(0,1fr))}.court-surface{height:210px}}
@media(max-width:650px){body{padding:14px 13px 92px}body>h1{font-size:22px}.card{padding:16px;border-radius:17px}#courtArea{grid-template-columns:1fr}.court-surface{height:190px}.team-overlay{font-size:17px}#appNav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-radius:16px 16px 0 0;padding:7px 5px;padding-bottom:max(8px,env(safe-area-inset-bottom))}#appNav a{font-size:11px;padding:12px 3px}.courts-summary .metric{min-width:0;padding:12px}.metric strong{font-size:23px}table{display:block;overflow-x:auto;white-space:nowrap}#playerTable td .player-record{font-size:10px}.court-menu .teams{grid-template-columns:1fr}#courtArea{gap:12px}.court-card .court-head{padding:12px 15px}}

</style>

</head>

<body>
<nav id="appNav" aria-label="ページ移動"><a href="#playersSection">選手</a><a href="#courtsSection">コート</a><a href="#rankingsSection">順位</a><a href="#historySection">履歴</a></nav>

<h1>
🎾 League of Enecom（エネコム社内大会）🏆
</h1>

<!-- ログイン -->

<div class="card">

<button onclick="refreshRanking()">ランキングを更新</button>

MVP/SVP表示
</button>

<script>

/***********************************
 共通変数
***********************************/

let role = "viewer";

const ADMIN_PASSWORD =
    "loe26d";

let players = [];
let courts = [];
let pairHistory = [];
let matchHistory = [];

let courtCount = 3;

let historyPage = 1;

const PAGE_SIZE = 10;

/***********************************
 ログイン
***********************************/

function login(){

    const selectedRole =

        document
        .getElementById(
            "loginRole"
        )
        .value;

    if(
        selectedRole==="admin"
    ){

        const password =

            document
            .getElementById(
                "adminPassword"
            )
            .value;

        if(
            password !==
            ADMIN_PASSWORD
        ){

            alert(
                "パスワードが違います"
            );

            return;
        }

    }

    role = selectedRole;

    applyRole();

    renderPlayers();
    renderCourts();
    renderHistory();
    renderRanking();
    renderAwards();

}

/***********************************
 権限定義
***********************************/

function applyRole(){

    const isAdmin =
        role==="admin";

    document
        .querySelectorAll(
            ".admin-only"
        )
        .forEach(el=>{

            el.classList.toggle(
                "hidden",
                !isAdmin
            );

        });

    document
        .getElementById(
            "loginStatus"
        )
        .innerHTML =

        isAdmin

        ?

        '<span class="admin">管理者でログイン中</span>'

        :

        '<span class="viewer">参加者でログイン中</span>';

}

/***********************************
 共通表示
***********************************/

function levelText(level){

    if(level===3){
        return "上級";
    }

    if(level===2){
        return "中級";
    }

    return "初級";

}

function statusText(status){

    switch(status){

        case "waiting":
            return "待機中";

        case "playing":
            return "試合中";

        case "rest":
            return "休憩中";

        default:
            return status;
    }

}

/***********************************
 Part2
 プレイヤー管理
***********************************/

/***********************************
 管理者メニュー
***********************************/

document.getElementById(
    "playerAdminArea"
).innerHTML = `

<h3>
👤 プレイヤー登録
</h3>

<input
 id="playerName"
 type="text"
 placeholder="名前">

<select id="playerLevel">

    <option value="3">上級</option>
    <option value="2">中級</option>
    <option value="1">初級</option>

</select>

<button onclick="addPlayer()">
登録
</button>

<hr>

<h3>
🏟 コート数設定
</h3>

<select id="courtCountSelect">

    <option value="1">1面</option>
    <option value="2">2面</option>
    <option value="3" selected>3面</option>
    <option value="4">4面</option>
    <option value="5">5面</option>
    <option value="6">6面</option>

</select>

<button onclick="saveCourtCount()">
保存
</button>

<span id="courtInfo">
現在：3面
</span>

`;

/***********************************
 プレイヤー追加
***********************************/

function addPlayer(){

    if(role !== "admin"){
        return;
    }

    const name =
        document
        .getElementById("playerName")
        .value
        .trim();

    if(!name){

        alert(
            "名前を入力してください"
        );

        return;
    }

    const level =
        Number(
            document
            .getElementById("playerLevel")
            .value
        );

    players.push({

        id: Date.now(),

        name: name,

        level: level,

        status: "waiting",

        point: 0,

        matchCount: 0,

        win: 0,

        lose: 0,

        draw: 0,

        comment: ""

    });

    document
        .getElementById(
            "playerName"
        )
        .value = "";

    renderPlayers();

    saveData();

}

/***********************************
 状態変更
***********************************/

function changePlayerStatus(
    index,
    status
){

    players[index].status =
        status;

    renderPlayers();

    saveData();

}

/***********************************
 ひとこと変更
***********************************/

function updateComment(
    index,
    value
){

    players[index].comment =
        value;

    saveData();

}

/***********************************
 コート数設定
***********************************/

function saveCourtCount(){

    if(role !== "admin"){
        return;
    }

    courtCount =
        Number(
            document
            .getElementById(
                "courtCountSelect"
            )
            .value
        );

    document
        .getElementById(
            "courtInfo"
        )
        .innerHTML =

        `現在：${courtCount}面`;

    renderCourts();

    saveData();

}

/***********************************
 プレイヤー一覧描画
***********************************/

function renderPlayers(){

    const tbody =
        document.getElementById(
            "playerTable"
        );

    if(!tbody){
        return;
    }

    let html = "";

    players.forEach(
        (player,index)=>{

        html += `

        <tr>

            <td>
            ${player.name}
            </td>

            <td>
            ${levelText(
                player.level
            )}
            </td>

            <td>

                <select
                 onchange="
                 changePlayerStatus(
                   ${index},
                   this.value
                 )
                 ">

                    <option
                      value="waiting"
                      ${
                        player.status==="waiting"
                        ? "selected"
                        : ""
                      }>
                      待機中
                    </option>

                    <option
                      value="playing"
                      ${
                        player.status==="playing"
                        ? "selected"
                        : ""
                      }>
                      試合中
                    </option>

                    <option
                      value="rest"
                      ${
                        player.status==="rest"
                        ? "selected"
                        : ""
                      }>
                      休憩中
                    </option>

                </select>

                <span
                 class="
                 status-badge
                 status-${player.status}
                 ">

                 ${statusText(
                    player.status
                 )}

                </span>

            </td>

            <td>
            ${player.point}<span class="player-record">${player.win}/${player.lose}/${player.draw}</span>
            </td>

            <td>
            ${player.matchCount}
            </td>

            <td>
            ${player.win}
            </td>

            <td>
            ${player.lose}
            </td>

            <td>
            ${player.draw}
            </td>

            <td>

                <input

                 class="comment-input"

                 value="${
                    player.comment || ""
                 }"

                 placeholder="ひとこと"

                 onchange="
                 updateComment(
                   ${index},
                   this.value
                 )
                 ">

            </td>

        </tr>

        `;

    });

    tbody.innerHTML = html;

}

/***********************************
 コート表示

 常に設定面数を表示
***********************************/


let selectedCourtId = null;
function escapeCourtText(value){
  return String(value ?? "").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function courtIllustration(playing,teamA=[],teamB=[]){
  const format = team=>team.map(p=>escapeCourtText(p.name)).join("・");
  return '<div class="court-surface" aria-hidden="true"><div class="court-lines"></div><div class="service-lines"></div><div class="net-line"></div>'
    + (playing?'<span class="team-overlay top">'+format(teamA)+'</span><span class="team-overlay versus">VS</span><span class="team-overlay bottom">'+format(teamB)+'</span>':'')
    + '</div>';
}
function renderCourts(){
  const area=document.getElementById("courtArea");
  if(!area)return;
  const active=courts.filter(c=>c.status==="playing");
  const summary=document.getElementById("courtSummary");
  if(summary)summary.innerHTML=[
    ["全コート",courtCount],["試合中",active.length],["空き",Math.max(0,courtCount-active.length)]
  ].map(([label,val])=>'<div class="metric">'+label+'<strong>'+String(val).padStart(2,"0")+'</strong></div>').join("");
  area.innerHTML=Array.from({length:courtCount},(_,index)=>{
    const id=index+1;
    const court=active.find(c=>c.id===id),busy=!!court;
    const title=busy?"タップして結果を入力":"タップしてマッチングを選択";
    const button=role==="admin"
      ?'<button class="court-action" onclick="openCourtAction('+id+')">'+title+'</button>'
      :'<div class="court-bottom">'+(busy?"試合中":"空きコート")+'</div>';
    return '<article class="court-card '+(busy?"court-playing":"court-empty")+'"><div class="court-head"><span>COURT '+String(id).padStart(2,"0")+'</span><span class="court-status '+(busy?"":"empty")+'">'+(busy?"● 試合中":"○ 空き")+'</span></div>'
      +courtIllustration(busy,court?.teamA,court?.teamB)+button+'</article>';
  }).join("");
  const panel=document.getElementById("courtInteraction");
  if(panel&&selectedCourtId!==null){
    const activeCourt=active.some(c=>c.id===selectedCourtId);
    if(selectedCourtId>courtCount){selectedCourtId=null;panel.innerHTML=""}
    else if(activeCourt){showScorePanel(selectedCourtId)}
    else if(!panel.querySelector(".court-menu")){showCourtMenu(selectedCourtId)}
  }
}
function openCourtAction(id){
  if(role!=="admin")return;
  selectedCourtId=id;
  const playing=courts.some(c=>c.id===id&&c.status==="playing");

/***********************************

***********************************/

function playerRating(player){

    return (

        player.level * 100

        +

        player.point * 10

    );

}

function teamRating(team){

    return team.reduce(

        (sum,player)=>

        sum + playerRating(player),

        0

    );

}

/***********************************
 ペア履歴回避
***********************************/

function pairPenalty(id1,id2){

    let penalty = 0;

    pairHistory
    .slice(-10)
    .forEach(pair=>{

        const hit =

        (
            pair[0]===id1
            &&
            pair[1]===id2
        )

        ||

        (
            pair[0]===id2
            &&
            pair[1]===id1
        );

        if(hit){

            penalty += 1000;

        }

    });

    return penalty;

}

/***********************************
 最適ペア
***********************************/

function findBestPairing(players4){

    const p1=players4[0];
    const p2=players4[1];
    const p3=players4[2];
    const p4=players4[3];

    const patterns=[

        [[p1,p2],[p3,p4]],
        [[p1,p3],[p2,p4]],
        [[p1,p4],[p2,p3]]

    ];

    let bestPattern = null;

    let bestScore =
        Number.MAX_SAFE_INTEGER;

    patterns.forEach(pattern=>{

        const teamA =
            pattern[0];

        const teamB =
            pattern[1];

        let score = Math.abs(

            teamRating(teamA)

            -

            teamRating(teamB)

        );

        score += pairPenalty(
            teamA[0].id,
            teamA[1].id
        );

        score += pairPenalty(
            teamB[0].id,
            teamB[1].id
        );

        if(score < bestScore){

            bestScore =
                score;

            bestPattern =
                pattern;

        }

    });

    return bestPattern;

}

function runMatching(){

    if(role!=="admin"){
        return;
    }

    const playingCount =

        courts.filter(
            c=>c.status==="playing"
        ).length;

    const freeCourtCount =

        courtCount - playingCount;

    if(freeCourtCount <= 0){

        alert(
            "空きコートがありません"
        );

        return;
    }

    const waitingPlayers =

        players

        .filter(
            p=>p.status==="waiting"
        )

        .sort((a,b)=>{

            if(
                a.matchCount !==
                b.matchCount
            ){

                return (
                    a.matchCount
                    -
                    b.matchCount
                );

            }

            return (

                playerRating(b)

                -

                playerRating(a)

            );

        });

    const selectedPlayers =

        waitingPlayers.slice(
            0,
            freeCourtCount * 4
        );

    if(
        selectedPlayers.length < 4
    ){

        alert(
            "待機中プレイヤーが不足しています"
        );

        return;
    }

    const usedCourtIds =

        courts

        .filter(
            c=>c.status==="playing"
        )

        .map(
            c=>c.id
        );

    const freeCourtIds = [];

    for(
        let i=1;
        i<=courtCount;
        i++
    ){

        if(
            !usedCourtIds.includes(i)
        ){

            freeCourtIds.push(i);

        }

    }

    let resultHtml = "";

    let courtIndex = 0;

    for(
        let i=0;
        i+3<selectedPlayers.length;
        i+=4
    ){

        if(
            courtIndex >=
            freeCourtIds.length
        ){
            break;
        }

        const courtId =
            freeCourtIds[courtIndex];

        courtIndex++;

        const bestPair =

            findBestPairing([

                selectedPlayers[i],
                selectedPlayers[i+1],
                selectedPlayers[i+2],
                selectedPlayers[i+3]

            ]);

        const teamA =
            bestPair[0];

        const teamB =
            bestPair[1];

        pairHistory.push({

            p1:teamA[0].id,
            p2:teamA[1].id

        });

        pairHistory.push({

            p1:teamB[0].id,
            p2:teamB[1].id

        });

        [...teamA,...teamB]

        .forEach(player=>{

            player.status =
                "playing";

        });

	const court = courts.find(
    		c=>c.id===courtId
	);

	court.status = "playing";
	court.teamA = teamA;
	court.teamB = teamB;

        resultHtml += `

        <div class="court-card">

            <h3>

            コート${courtId}

            </h3>

            ${teamA[0].name}
            &
            ${teamA[1].name}

            <br>

            ペアレート:
            ${teamRating(teamA)}

            <hr>

            VS

            <hr>

            ${teamB[0].name}
            &
            ${teamB[1].name}

            <br>

            ペアレート:
            ${teamRating(teamB)}

        </div>

        `;

    }

    document
    .getElementById(
        "matchingResult"
    )
    .innerHTML =
        resultHtml;

    renderPlayers();
    renderCourts();

    saveData();

}

function createManualMatch(){

    if(role!=="admin"){
        return;
    }

    const playingCount =

        courts.filter(
            c=>c.status==="playing"
        ).length;

    if(
        playingCount >=
        courtCount
    ){

        alert(
            "空きコートがありません"
        );

        return;
    }

    const ids = [

        Number(document.getElementById("teamA1").value),
        Number(document.getElementById("teamA2").value),
        Number(document.getElementById("teamB1").value),
        Number(document.getElementById("teamB2").value)

    ];

    if(
        new Set(ids).size !== 4
    ){

        alert(
            "同じプレイヤーは選択できません"
        );

        return;
    }

    let freeCourtId = null;

    for(
        let i=1;
        i<=courtCount;
        i++
    ){

        const exists =

            courts.find(
                c=>
                c.id===i
                &&
                c.status==="playing"
            );

        if(!exists){

            freeCourtId = i;

            break;
        }

    }

    const teamA = [

        players.find(
            p=>p.id===ids[0]
        ),

        players.find(
            p=>p.id===ids[1]
        )

    ];

    const teamB = [

        players.find(
            p=>p.id===ids[2]
        ),

        players.find(
            p=>p.id===ids[3]
        )

    ];

    [...teamA,...teamB]

    .forEach(player=>{

        player.status =
            "playing";

    });

    courts.push({

        id:freeCourtId,

        status:"playing",

        teamA,
        teamB

    });

    renderPlayers();
    renderCourts();

    saveData();

}

    renderPlayers();
    renderCourts();

    saveData();

}

/***********************************
 ポイント計算
***********************************/

function applyResult(
    court,
    scoreA,
    scoreB
){

    if(scoreA > scoreB){

        court.teamA.forEach(player=>{

            player.point += 3;
            player.win++;
            player.matchCount++;

        });

        court.teamB.forEach(player=>{

            player.point -= 1;
            player.lose++;
            player.matchCount++;

        });

    }
    else if(scoreB > scoreA){

        court.teamB.forEach(player=>{

            player.point += 3;
            player.win++;
            player.matchCount++;

        });

        court.teamA.forEach(player=>{

            player.point -= 1;
            player.lose++;
            player.matchCount++;

        });

    }
    else{

        [...court.teamA,...court.teamB]

        .forEach(player=>{

            player.point += 1;
            player.draw++;
            player.matchCount++;

        });

    }

}

        player.draw = 0;

        player.matchCount = 0;

    });

    matchHistory.forEach(match=>{

        const teamA =
            players.filter(
                p=>
                match.teamA.includes(
                    p.name
                )
            );

        const teamB =
            players.filter(
                p=>
                match.teamB.includes(
                    p.name
                )
            );

        applyResult(
            {
                teamA,
                teamB
            },
            match.scoreA,
            match.scoreB
        );

    });

    renderPlayers();
    renderRanking();
    renderAwards();
    renderHistory();

            window.db,
            "system",
            "current"
        ),

        {

            players,
            courts,
            matchHistory,
            pairHistory,
            courtCount

        }

    );

}

/***********************************
 リアルタイム同期
***********************************/

function startRealtimeSync(){

    window.onSnapshot(

        window.doc(
            window.db,
            "system",
            "current"
        ),

        snapshot => {

            if(!snapshot.exists()){
                return;
            }

            const data =
                snapshot.data();

            players =
                data.players || [];

            courts =
                data.courts || [];

            matchHistory =
                data.matchHistory || [];

            pairHistory =
                data.pairHistory || [];

            courtCount =
                data.courtCount || 3;

            const info =
                document.getElementById(
                    "courtInfo"
                );

            if(info){

                info.innerHTML =
                    `現在：${courtCount}面`;

            }

            const select =
                document.getElementById(
                    "courtCountSelect"
                );

            if(select){

                select.value =
                    courtCount;

            }

            renderPlayers();
            renderCourts();
            renderRanking();
            renderAwards();
            renderHistory();

        }

    );

}

/***********************************
 初期描画
***********************************/

renderHistory();
renderRanking();
renderAwards();

</script>
