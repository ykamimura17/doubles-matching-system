<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
🎾 League of Enecom（エネコム社内大会）🏆
</title>

<style>

:root{

    --primary:#5BA8FF;
    --primary-hover:#2E86F7;

    --bg:#F5F7FB;
    --card:#FFFFFF;

}

/***********************************
 共通
***********************************/

body{

    background:var(--bg);

    margin:20px;

    font-family:
        "Segoe UI",
        sans-serif;

}

h1{

    color:#1565C0;

}

.hidden{

    display:none;

}

.card{

    background:white;

    border-radius:16px;

    padding:16px;

    margin-bottom:16px;

    box-shadow:
      0 4px 12px
      rgba(0,0,0,.08);

}

/***********************************
 ボタン
***********************************/

button{

    background:var(--primary);

    color:white;

    border:none;

    border-radius:10px;

    padding:10px 16px;

    cursor:pointer;

    font-size:14px;

    font-weight:600;

    transition:.2s;

    margin:4px;

}

button:hover{

    background:
        var(--primary-hover);

    transform:
        translateY(-1px);

}

/***********************************
 入力
***********************************/

input,
select{

    padding:8px;

    border:
      1px solid #ddd;

    border-radius:8px;

    margin:4px;

}

/***********************************
 テーブル
***********************************/

table{

    width:100%;

    border-collapse:
        collapse;

}

th,
td{

    border:
        1px solid #ddd;

    padding:8px;

}

th{

    background:#1976D2;

    color:white;

}

/***********************************
 列幅
***********************************/

.col-name{

    width:150px;

}

.col-status{

    width:200px;

}

.col-point{

    width:80px;

    text-align:center;

}

.col-match{

    width:80px;

    text-align:center;

}

.col-small{

    width:80px;

    text-align:center;

}

.col-comment{

    width:450px;

}

/***********************************
 状態
***********************************/

.status-badge{

    display:inline-block;

    padding:4px 8px;

    border-radius:8px;

    font-weight:bold;

}

.status-waiting{

    background:#E3F2FD;

    color:#1565C0;

}

.status-playing{

    background:#FFEBEE;

    color:#C62828;

}

.status-rest{

    background:#EEEEEE;

    color:#616161;

}

/***********************************
 コート
***********************************/

.court-card{

    background:white;

    border-left:
        8px solid #4CAF50;

    border-radius:12px;

    padding:12px;

    margin-bottom:10px;

}

.court-playing{

    border-left-color:#D32F2F;

}

.court-empty{

    border-left-color:#4CAF50;

}

/***********************************
 ランキング
***********************************/

.rank-card{

    background:#FFF8E1;

    border-left:
      6px solid gold;

    padding:10px;

    margin-bottom:6px;

}

/***********************************
 MVP
***********************************/

.award-card{

    background:#FFFDE7;

    border-left:
      6px solid gold;

    padding:12px;

    margin-bottom:10px;

}

/***********************************
 その他
***********************************/

.comment-input{

    width:350px;

}

.admin{

    color:#C62828;
    font-weight:bold;

}

.viewer{

    color:#1565C0;
    font-weight:bold;

}

.pager{

    text-align:center;

    margin-top:10px;

}

</style>

</head>

<body>

</h1>

<!-- ログイン -->

<h2>

<table>

<thead>

<tr>

<th class="col-name">

</th>

<th class="col-point">
Pt

<th class="col-match">

</button>

MVP/SVP表示
</button>

<div

</div>

<div

</div>

</div>

<!-- 履歴 -->

<div class="card">

<h2>
📋 試合履歴
</h2>

<div id="historyArea">

</div>

<div class="pager">

◀ 前へ
</button>

<span id="pageInfo">
1 / 1
</span>

<button onclick="nextPage()">
次へ ▶
</button>

<script>

/***********************************
 共通変数
***********************************/

let role = "viewer";

const ADMIN_PASSWORD =
    "loe26d";

let players = [];
let courts = [];
let pairHistory = [];
let matchHistory = [];

let courtCount = 3;

let historyPage = 1;

const PAGE_SIZE = 10;

/***********************************
 ログイン
***********************************/

function login(){

    const selectedRole =

        document
        .getElementById(
            "loginRole"
        )
        .value;

    if(
        selectedRole==="admin"
    ){

        const password =

            document
            .getElementById(
                "adminPassword"
            )
            .value;

        if(
            password !==
            ADMIN_PASSWORD
        ){

            alert(
                "パスワードが違います"
            );

            return;
        }

    }

    role = selectedRole;

    applyRole();

    renderPlayers();
    renderCourts();
    renderHistory();
    renderRanking();
    renderAwards();

}

/***********************************
 権限定義
***********************************/

function applyRole(){

    const isAdmin =
        role==="admin";

    document
        .querySelectorAll(
            ".admin-only"
        )
        .forEach(el=>{

            el.classList.toggle(
                "hidden",
                !isAdmin
            );

        });

    document
        .getElementById(
            "loginStatus"
        )
        .innerHTML =

        isAdmin

        ?

        '<span class="admin">管理者でログイン中</span>'

        :

        '<span class="viewer">参加者でログイン中</span>';

}

/***********************************
 共通表示
***********************************/

function levelText(level){

    if(level===3){
        return "上級";
    }

    if(level===2){
        return "中級";
    }

    return "初級";

}

function statusText(status){

    switch(status){

        case "waiting":
            return "待機中";

        case "playing":
            return "試合中";

        case "rest":
            return "休憩中";

        default:
            return status;
    }

}

/***********************************
 Part2
 プレイヤー管理
***********************************/

/***********************************
 管理者メニュー
***********************************/

document.getElementById(
    "playerAdminArea"
).innerHTML = `

<h3>
👤 プレイヤー登録
</h3>

<input
 id="playerName"
 type="text"
 placeholder="名前">

<select id="playerLevel">

    <option value="3">上級</option>
    <option value="2">中級</option>
    <option value="1">初級</option>

</select>

<button onclick="addPlayer()">
登録
</button>

<hr>

<h3>
🏟 コート数設定
</h3>

<select id="courtCountSelect">

    <option value="1">1面</option>
    <option value="2">2面</option>
    <option value="3" selected>3面</option>
    <option value="4">4面</option>
    <option value="5">5面</option>
    <option value="6">6面</option>

</select>

<button onclick="saveCourtCount()">
保存
</button>

<span id="courtInfo">
現在：3面
</span>

`;

/***********************************
 プレイヤー追加
***********************************/

function addPlayer(){

    if(role !== "admin"){
        return;
    }

    const name =
        document
        .getElementById("playerName")
        .value
        .trim();

    if(!name){

        alert(
            "名前を入力してください"
        );

        return;
    }

    const level =
        Number(
            document
            .getElementById("playerLevel")
            .value
        );

    players.push({

        id: Date.now(),

        name: name,

        level: level,

        status: "waiting",

        point: 0,

        matchCount: 0,

        win: 0,

        lose: 0,

        draw: 0,

        comment: ""

    });

    document
        .getElementById(
            "playerName"
        )
        .value = "";

    renderPlayers();

    saveData();

}

/***********************************
 状態変更
***********************************/

function changePlayerStatus(
    index,
    status
){

    players[index].status =
        status;

    renderPlayers();

    saveData();

}

/***********************************
 ひとこと変更
***********************************/

function updateComment(
    index,
    value
){

    players[index].comment =
        value;

    saveData();

}

/***********************************
 コート数設定
***********************************/

function saveCourtCount(){

    if(role !== "admin"){
        return;
    }

    courtCount =
        Number(
            document
            .getElementById(
                "courtCountSelect"
            )
            .value
        );

    document
        .getElementById(
            "courtInfo"
        )
        .innerHTML =

        `現在：${courtCount}面`;

    renderCourts();

    saveData();

}

/***********************************
 プレイヤー一覧描画
***********************************/

function renderPlayers(){

    const tbody =
        document.getElementById(
            "playerTable"
        );

    if(!tbody){
        return;
    }

    let html = "";

    players.forEach(
        (player,index)=>{

        html += `

        <tr>

            <td>
            ${player.name}
            </td>

            <td>
            ${levelText(
                player.level
            )}
            </td>

            <td>

                <select
                 onchange="
                 changePlayerStatus(
                   ${index},
                   this.value
                 )
                 ">

                    <option
                      value="waiting"
                      ${
                        player.status==="waiting"
                        ? "selected"
                        : ""
                      }>
                      待機中
                    </option>

                    <option
                      value="playing"
                      ${
                        player.status==="playing"
                        ? "selected"
                        : ""
                      }>
                      試合中
                    </option>

                    <option
                      value="rest"
                      ${
                        player.status==="rest"
                        ? "selected"
                        : ""
                      }>
                      休憩中
                    </option>

                </select>

                <span
                 class="
                 status-badge
                 status-${player.status}
                 ">

                 ${statusText(
                    player.status
                 )}

                </span>

            </td>

            <td>
            ${player.point}
            </td>

            <td>
            ${player.matchCount}
            </td>

            <td>
            ${player.win}
            </td>

            <td>
            ${player.lose}
            </td>

            <td>
            ${player.draw}
            </td>

            <td>

                <input

                 class="comment-input"

                 value="${
                    player.comment || ""
                 }"

                 placeholder="ひとこと"

                 onchange="
                 updateComment(
                   ${index},
                   this.value
                 )
                 ">

            </td>

        </tr>

        `;

    });

    tbody.innerHTML = html;

}

/***********************************
 コート表示

 常に設定面数を表示
***********************************/

function renderCourts(){

    const area =
        document.getElementById(
            "courtArea"
        );

    if(!area){
        return;
    }

    let html = "";

    for(
        let courtId = 1;
        courtId <= courtCount;
        courtId++
    ){

        const court =

            courts.find(
                c =>
                c.id===courtId &&
                c.status==="playing"
            );

        if(!court){

            html += `

            <div
             class="
             court-card
             court-empty
             ">

                <h3>

                コート${courtId}

                🟢空き

                </h3>

            </div>

            `;

            continue;
        }

        html += `

        <div
         class="
         court-card
         court-playing
         ">

            <h3>

            コート${courtId}

            🔴試合中

            </h3>

            <b>

            ${court.teamA[0].name}

            &

            ${court.teamA[1].name}

            </b>

            <br>

            VS

            <br>

            <b>

            ${court.teamB[0].name}

            &

            ${court.teamB[1].name}

            </b>

        </div>

        `;

	if(role==="admin"){

            html += `

            <hr>

            Aチーム

            <input
             type="number"
             min="0"
             max="4"
             value="0"
             id="scoreA-${court.id}">

            <br><br>

            Bチーム

            <input
             type="number"
             min="0"
             max="4"
             value="0"
             id="scoreB-${court.id}">

            <br><br>

            <button
             onclick="
             registerMatchResult(
             ${court.id}
             )
             ">

             結果登録

            </button>

            <button
             onclick="
             cancelMatch(
             ${court.id}
             )
             ">

             試合取消

            </button>

            `;

        }

    }

    area.innerHTML = html;

}

/***********************************
 初期描画
***********************************/

renderPlayers();
renderCourts();

/***********************************
 Part3
 マッチング
***********************************/

/***********************************
 手動マッチング表示
***********************************/

function toggleManualMatch(){

    if(role !== "admin"){
        return;
    }

    const area =
        document.getElementById(
            "manualMatchArea"
        );

    area.classList.toggle(
        "hidden"
    );

    if(
        !area.classList.contains(
            "hidden"
        )
    ){

        renderManualMatch();

    }

}

/***********************************
 レート
***********************************/

function playerRating(player){

    return (

        player.level * 100

        +

        player.point * 10

    );

}

function teamRating(team){

    return team.reduce(

        (sum,player)=>

        sum + playerRating(player),

        0

    );

}

/***********************************
 ペア履歴回避
***********************************/

function pairPenalty(id1,id2){

    let penalty = 0;

    pairHistory
    .slice(-10)
    .forEach(pair=>{

        const hit =

        (
            pair[0]===id1
            &&
            pair[1]===id2
        )

        ||

        (
            pair[0]===id2
            &&
            pair[1]===id1
        );

        if(hit){

            penalty += 1000;

        }

    });

    return penalty;

}

/***********************************
 最適ペア
***********************************/

function findBestPairing(players4){

    const p1=players4[0];
    const p2=players4[1];
    const p3=players4[2];
    const p4=players4[3];

    const patterns=[

        [[p1,p2],[p3,p4]],
        [[p1,p3],[p2,p4]],
        [[p1,p4],[p2,p3]]

    ];

    let bestPattern = null;

    let bestScore =
        Number.MAX_SAFE_INTEGER;

    patterns.forEach(pattern=>{

        const teamA =
            pattern[0];

        const teamB =
            pattern[1];

        let score = Math.abs(

            teamRating(teamA)

            -

            teamRating(teamB)

        );

        score += pairPenalty(
            teamA[0].id,
            teamA[1].id
        );

        score += pairPenalty(
            teamB[0].id,
            teamB[1].id
        );

        if(score < bestScore){

            bestScore =
                score;

            bestPattern =
                pattern;

        }

    });

    return bestPattern;

}

/***********************************
 自動マッチング
***********************************/

function runMatching(){

    if(role!=="admin"){
        return;
    }

    const playingCount =

        courts.filter(
            c=>c.status==="playing"
        ).length;

    const freeCourtCount =

        courtCount - playingCount;

    if(freeCourtCount <= 0){

        alert(
            "空きコートがありません"
        );

        return;
    }

    const waitingPlayers =

        players

        .filter(
            p=>p.status==="waiting"
        )

        .sort((a,b)=>{

            if(
                a.matchCount !==
                b.matchCount
            ){

                return (
                    a.matchCount
                    -
                    b.matchCount
                );

            }

            return (

                playerRating(b)

                -

                playerRating(a)

            );

        });

    const selectedPlayers =

        waitingPlayers.slice(
            0,
            freeCourtCount * 4
        );

    if(
        selectedPlayers.length < 4
    ){

        alert(
            "待機中プレイヤーが不足しています"
        );

        return;
    }

    const usedCourtIds =

        courts

        .filter(
            c=>c.status==="playing"
        )

        .map(
            c=>c.id
        );

    const freeCourtIds = [];

    for(
        let i=1;
        i<=courtCount;
        i++
    ){

        if(
            !usedCourtIds.includes(i)
        ){

            freeCourtIds.push(i);

        }

    }

    let resultHtml = "";

    let courtIndex = 0;

    for(
        let i=0;
        i+3<selectedPlayers.length;
        i+=4
    ){

        if(
            courtIndex >=
            freeCourtIds.length
        ){
            break;
        }

        const courtId =
            freeCourtIds[courtIndex];

        courtIndex++;

        const bestPair =

            findBestPairing([

                selectedPlayers[i],
                selectedPlayers[i+1],
                selectedPlayers[i+2],
                selectedPlayers[i+3]

            ]);

        const teamA =
            bestPair[0];

        const teamB =
            bestPair[1];

        pairHistory.push({

            p1:teamA[0].id,
            p2:teamA[1].id

        });

        pairHistory.push({

            p1:teamB[0].id,
            p2:teamB[1].id

        });

        [...teamA,...teamB]

        .forEach(player=>{

            player.status =
                "playing";

        });

	const court = courts.find(
    		c=>c.id===courtId
	);

	court.status = "playing";
	court.teamA = teamA;
	court.teamB = teamB;

        resultHtml += `

        <div class="court-card">

            <h3>

            コート${courtId}

            </h3>

            ${teamA[0].name}
            &
            ${teamA[1].name}

            <br>

            ペアレート:
            ${teamRating(teamA)}

            <hr>

            VS

            <hr>

            ${teamB[0].name}
            &
            ${teamB[1].name}

            <br>

            ペアレート:
            ${teamRating(teamB)}

        </div>

        `;

    }

    document
    .getElementById(
        "matchingResult"
    )
    .innerHTML =
        resultHtml;

    renderPlayers();
    renderCourts();

    saveData();

}

/***********************************
 手動マッチングUI
***********************************/

function renderManualMatch(){

    const waitingPlayers =

        players.filter(
            p=>p.status==="waiting"
        );

    const options =

        waitingPlayers.map(player=>`

        <option value="${player.id}">

            ${player.name}

        </option>

        `).join("");

    document
    .getElementById(
        "manualMatchArea"
    )
    .innerHTML = `

    <h3>
    手動試合作成
    </h3>

    <h4>チームA</h4>

    <select id="teamA1">${options}</select>

    <select id="teamA2">${options}</select>

    <h4>チームB</h4>

    <select id="teamB1">${options}</select>

    <select id="teamB2">${options}</select>

    <br>

    <button
     onclick="createManualMatch()">

     試合作成

    </button>

    `;

}

/***********************************
 手動試合作成
***********************************/

function createManualMatch(){

    if(role!=="admin"){
        return;
    }

    const playingCount =

        courts.filter(
            c=>c.status==="playing"
        ).length;

    if(
        playingCount >=
        courtCount
    ){

        alert(
            "空きコートがありません"
        );

        return;
    }

    const ids = [

        Number(document.getElementById("teamA1").value),
        Number(document.getElementById("teamA2").value),
        Number(document.getElementById("teamB1").value),
        Number(document.getElementById("teamB2").value)

    ];

    if(
        new Set(ids).size !== 4
    ){

        alert(
            "同じプレイヤーは選択できません"
        );

        return;
    }

    let freeCourtId = null;

    for(
        let i=1;
        i<=courtCount;
        i++
    ){

        const exists =

            courts.find(
                c=>
                c.id===i
                &&
                c.status==="playing"
            );

        if(!exists){

            freeCourtId = i;

            break;
        }

    }

    const teamA = [

        players.find(
            p=>p.id===ids[0]
        ),

        players.find(
            p=>p.id===ids[1]
        )

    ];

    const teamB = [

        players.find(
            p=>p.id===ids[2]
        ),

        players.find(
            p=>p.id===ids[3]
        )

    ];

    [...teamA,...teamB]

    .forEach(player=>{

        player.status =
            "playing";

    });

    courts.push({

        id:freeCourtId,

        status:"playing",

        teamA,
        teamB

    });

    renderPlayers();
    renderCourts();

    saveData();

}

/***********************************
 試合取消
***********************************/

function cancelMatch(courtId){

    if(role !== "admin"){
        return;
    }

    if(
        !confirm(
            "試合を取り消しますか？"
        )
    ){
        return;
    }

    const court =

        courts.find(
            c =>
            c.id === courtId &&
            c.status === "playing"
        );

    if(!court){
        return;
    }

    [...court.teamA,...court.teamB]

    .forEach(player=>{

        const target =
            players.find(
                p => p.id === player.id
            );

        if(target){

            target.status =
                "waiting";

        }

    });

    court.status = "empty";

    delete court.teamA;
    delete court.teamB;

    renderPlayers();
    renderCourts();

    saveData();

}
/***********************************
 Part4
 結果管理・ランキング・履歴
***********************************/

/***********************************
 試合結果登録
***********************************/

function registerMatchResult(
    courtId
){

    if(role !== "admin"){
        return;
    }

    const court =
    	courts.find(
       	    c=>
       	    c.id===courtId &&
       	    c.status==="playing"
    	);

    if(
        !court ||
        !court.teamA ||
        !court.teamB
    ){

        alert(
            "試合情報が見つかりません"
        );

        return;
    }

    if(!court){
        return;
    }

    const scoreA =
        Number(
            document
            .getElementById(
                `scoreA-${courtId}`
            )
            .value
        );

    const scoreB =
        Number(
            document
            .getElementById(
                `scoreB-${courtId}`
            )
            .value
        );

    matchHistory.unshift({

    id: Date.now(),

    date: new Date(),

    courtId,

    teamA:[
        court.teamA[0].name,
        court.teamA[1].name
    ],

    teamB:[
        court.teamB[0].name,
        court.teamB[1].name
    ],

    scoreA,
    scoreB

});

[...court.teamA,...court.teamB]

.forEach(player=>{

    const target = players.find(
        p => p.id === player.id
    );

    if(target){

        target.status =
            "waiting";

    }

});
court.status =
    "empty";

delete court.teamA;
delete court.teamB;

recalculateAll();

saveData();

}

/***********************************
 ポイント計算
***********************************/

function applyResult(
    court,
    scoreA,
    scoreB
){

    if(scoreA > scoreB){

        court.teamA.forEach(player=>{

            player.point += 3;
            player.win++;
            player.matchCount++;

        });

        court.teamB.forEach(player=>{

            player.point -= 1;
            player.lose++;
            player.matchCount++;

        });

    }
    else if(scoreB > scoreA){

        court.teamB.forEach(player=>{

            player.point += 3;
            player.win++;
            player.matchCount++;

        });

        court.teamA.forEach(player=>{

            player.point -= 1;
            player.lose++;
            player.matchCount++;

        });

    }
    else{

        [...court.teamA,...court.teamB]

        .forEach(player=>{

            player.point += 1;
            player.draw++;
            player.matchCount++;

        });

    }

}

/***********************************
 ランキング
***********************************/

function toggleRanking(){

    document
    .getElementById(
        "rankingArea"
    )
    .classList
    .toggle(
        "hidden"
    );

    renderRanking();

}

function renderRanking(){

    const area =
        document
        .getElementById(
            "rankingArea"
        );

    if(
        area.classList.contains(
            "hidden"
        )
    ){
        return;
    }

    const ranking =

        [...players]

        .sort(
            (a,b)=>
            b.point-a.point
        );

    let html = "";

    ranking.forEach(
        (player,index)=>{

        html += `

        <div class="rank-card">

            ${index+1}位

            ${player.name}

            :

            ${player.point}pt

        </div>

        `;

    });

    area.innerHTML =
        html;

}

/***********************************
 MVP / SVP
***********************************/

function toggleAwards(){

    document
    .getElementById(
        "awardArea"
    )
    .classList
    .toggle(
        "hidden"
    );

    renderAwards();

}

function renderAwards(){

    const area =
        document
        .getElementById(
            "awardArea"
        );

    if(
        area.classList.contains(
            "hidden"
        )
    ){
        return;
    }

    const ranking =

        [...players]

        .sort(
            (a,b)=>
            b.point-a.point
        );

    let html = "";

    if(ranking[0]){

        html += createAwardCard(
            "🏆 MVP",
            ranking[0]
        );

    }

    if(ranking.length > 1){

        html += createAwardCard(
            "🥈 SVP",
            ranking[1]
        );

    }

    area.innerHTML =
        html;

}

function createAwardCard(
    title,
    player
){

    const total =

        player.win +
        player.lose +
        player.draw;

    const winRate =

        total===0

        ? 0

        : (
            player.win
            /
            total
            *
            100
        ).toFixed(1);

    return `

    <div class="award-card">

        <h3>${title}</h3>

        <b>${player.name}</b>

        <hr>

        ポイント：${player.point}<br>

        勝：${player.win}<br>

        負：${player.lose}<br>

        分：${player.draw}<br>

        試合数：${player.matchCount}<br>

        勝率：${winRate}%

    </div>

    `;

}

/***********************************
 試合履歴
***********************************/

function renderHistory(){

    const area =
        document
        .getElementById(
            "historyArea"
        );

    const start =
        (historyPage-1)
        * PAGE_SIZE;

    const pageData =

        matchHistory.slice(
            start,
            start + PAGE_SIZE
        );

    let html = "";

    pageData.forEach(match=>{

        html += `

        <div class="court-card">

            ${match.teamA[0]}
            &
            ${match.teamA[1]}

            <br>

            ${match.scoreA}
            -

            ${match.scoreB}

            <br>

            ${match.teamB[0]}
            &
            ${match.teamB[1]}

        `;

        if(role==="admin"){

            html += `

            <hr>

            <button
             onclick="
             editHistory(
                ${match.id}
             )
             ">

             修正

            </button>

            <button
             onclick="
             deleteHistory(
                ${match.id}
             )
             ">

             削除

            </button>

            `;

        }

        html += `

        </div>

        `;

    });

    area.innerHTML = html;

    const totalPage =

        Math.max(
            1,
            Math.ceil(
                matchHistory.length
                /
                PAGE_SIZE
            )
        );

    document
    .getElementById(
        "pageInfo"
    )
    .innerHTML =

    `${historyPage} / ${totalPage}`;

}

/***********************************
 ページ送り
***********************************/

function nextPage(){

    const totalPage =

        Math.max(
            1,
            Math.ceil(
                matchHistory.length
                /
                PAGE_SIZE
            )
        );

    if(
        historyPage <
        totalPage
    ){

        historyPage++;

        renderHistory();

    }

}

function prevPage(){

    if(historyPage > 1){

        historyPage--;

        renderHistory();

    }

}

/***********************************
 履歴修正
***********************************/

function editHistory(id){

    if(role!=="admin"){
        return;
    }

    const match =
        matchHistory.find(
            m=>m.id===id
        );

    if(!match){
        return;
    }

    const scoreA =
        prompt(
            "Aチームゲーム数",
            match.scoreA
        );

    const scoreB =
        prompt(
            "Bチームゲーム数",
            match.scoreB
        );

    if(
        scoreA===null ||
        scoreB===null
    ){
        return;
    }

    match.scoreA =
        Number(scoreA);

    match.scoreB =
        Number(scoreB);

    recalculateAll();

    saveData();

}

/***********************************
 履歴削除
***********************************/

function deleteHistory(id){

    if(role!=="admin"){
        return;
    }

    if(
        !confirm(
            "履歴を削除しますか？"
        )
    ){
        return;
    }

    matchHistory =
        matchHistory.filter(
            m=>m.id!==id
        );

    recalculateAll();

    saveData();

}

/***********************************
 全再計算
***********************************/

function recalculateAll(){

    players.forEach(player=>{

        player.point = 0;

        player.win = 0;

        player.lose = 0;

        player.draw = 0;

        player.matchCount = 0;

    });

    matchHistory.forEach(match=>{

        const teamA =
            players.filter(
                p=>
                match.teamA.includes(
                    p.name
                )
            );

        const teamB =
            players.filter(
                p=>
                match.teamB.includes(
                    p.name
                )
            );

        applyResult(
            {
                teamA,
                teamB
            },
            match.scoreA,
            match.scoreB
        );

    });

    renderPlayers();
    renderRanking();
    renderAwards();
    renderHistory();

}

/***********************************
 データ登録
***********************************/

async function saveData(){

console.log({

  courts,

  matchHistory

});

    await setDoc(

        window.doc(
            window.db,

        ),

            pairHistory,
            courtCount

        }

    );

}

/***********************************
 リアルタイム同期
***********************************/

function startRealtimeSync(){

    window.onSnapshot(

        window.doc(
            window.db,
            "system",
            "current"
        ),

        snapshot => {

            if(!snapshot.exists()){
                return;
            }

            const data =
                snapshot.data();

            players =
                data.players || [];

            courts =
                data.courts || [];

            matchHistory =
                data.matchHistory || [];

            pairHistory =
                data.pairHistory || [];

            courtCount =
                data.courtCount || 3;

            const info =
                document.getElementById(
                    "courtInfo"
                );

            if(info){

                info.innerHTML =
                    `現在：${courtCount}面`;

            }

            const select =
                document.getElementById(
                    "courtCountSelect"
                );

            if(select){

                select.value =
                    courtCount;

            }

            renderPlayers();
            renderCourts();
            renderRanking();
            renderAwards();
            renderHistory();

        }

    );

}

***********************************/

renderHistory();
renderRanking();
renderAwards();
