runConfig:
  minInstances: 0
  maxInstances: 2
env:
  - variable: FIREBASE_PROJECT_ID
    value: tennis-club-system
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: tennis-club-system
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: tennis-club-system.firebaseapp.com
    availability: [BUILD, RUNTIME]
# Set NEXT_PUBLIC_FIREBASE_API_KEY and NEXT_PUBLIC_FIREBASE_APP_ID in the
# App Hosting console for BOTH build and runtime, using this project's Web app.
# No service account key: the runtime uses Application Default Credentials.
